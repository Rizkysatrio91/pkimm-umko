<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PK IMM FTIK UMKO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        maroon: { DEFAULT: '#5B1525', dark: '#3D0C15' },
                        gold:   { DEFAULT: '#D4A843' },
                        cream:  { DEFAULT: '#FDF8F0' },
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'images/logo_pk_imm_ftik.png' %}">
</head>
<body class="min-h-full bg-gradient-to-br from-[#2D0810] via-[#3D0C15] to-[#2D0810] flex items-center justify-center p-4">
    <div class="w-full max-w-sm">

        <!-- Header -->
        <div class="flex items-center gap-3 mb-8">
            <a href="{% url 'accounts:login' %}" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white/60 hover:bg-white/20 hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </a>
            <h1 class="text-white font-bold text-lg">Reset Password</h1>
        </div>

        <!-- Step Indicator -->
        <div class="flex items-center gap-2 mb-8">
            <div class="w-8 h-8 rounded-full bg-[#5B1525] flex items-center justify-center text-white text-xs font-bold">1</div>
            <div class="flex-1 h-0.5 bg-white/10"></div>
            <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white/30 text-xs font-bold">2</div>
            <div class="flex-1 h-0.5 bg-white/10"></div>
            <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white/30 text-xs font-bold">3</div>
        </div>

        <!-- Flash Messages -->
        {% if messages %}
        <div class="mb-4 space-y-2">
            {% for message in messages %}
            <div class="px-4 py-3 rounded-xl text-sm
                 {% if message.tags == 'error' %}bg-red-900/40 text-red-300 border border-red-700/30
                 {% else %}bg-blue-900/40 text-blue-300 border border-blue-700/30{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Step 1: Email -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 rounded-full bg-white/10 flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-[#5B1525]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
            </div>
            <h2 class="text-white font-bold text-lg">Verifikasi Email</h2>
            <p class="text-white/40 text-sm mt-1">Masukkan email untuk menerima kode OTP</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                    <svg class="w-5 h-5 text-white/30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <input type="email" name="email" id="id_email" value="{{ form.email.value|default:'' }}"
                       placeholder="Email Anda" autocomplete="email"
                       class="w-full pl-10 pr-4 py-3 border border-white/10 rounded-xl text-white placeholder-white/30 text-sm focus:ring-2 focus:ring-maroon transition"
                       style="background: rgba(255,255,255,0.06)"
                       >
            </div>
            {% for error in form.email.errors %}
            <p class="text-xs text-red-400">{{ error }}</p>
            {% endfor %}
            <button type="submit"
                    class="w-full bg-[#5B1525] text-white py-3 rounded-xl font-bold text-sm hover:bg-maroon transition uppercase tracking-wide">
                KIRIM KODE OTP
            </button>
        </form>
    </div>
</body>
</html>
