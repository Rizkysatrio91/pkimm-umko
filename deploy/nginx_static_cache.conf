# =============================================================================
# nginx — cache headers untuk static + media + gzip
# =============================================================================
# Snippet ini di-include di dalam server block utama, di luar location / utama.
#
# Cara pakai:
#   1. Cek dulu STATIC_ROOT + MEDIA_ROOT di config/settings/production.py
#      (atau .env), pastikan path di bawah sesuai. Default Django:
#        STATIC_ROOT = BASE_DIR / 'staticfiles'
#        MEDIA_ROOT  = BASE_DIR / 'media'
#
#   2. Copy ke server:
#        sudo cp deploy/nginx_static_cache.conf /etc/nginx/snippets/static_cache.conf
#
#   3. Di /etc/nginx/sites-enabled/pkimm-umko, ganti location /static/ dan
#      location /media/ yang lama dengan baris ini di dalam server { ... }:
#        include snippets/static_cache.conf;
#
#   4. Test config: sudo nginx -t
#   5. Reload:      sudo systemctl reload nginx
#
# Catatan: WebP TIDAK perlu content negotiation di sisi server karena template
# Django sudah pakai <picture> tag dengan source type="image/webp". Browser
# yang support WebP akan request file .webp langsung; yang tidak akan fallback
# ke .jpg/.png. Lihat core/templatetags/image_tags.py.
# =============================================================================

# --- Gzip kompresi untuk teks (CSS/JS/HTML/JSON/SVG/XML) ---------------------
gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/woff
    font/woff2;

# --- Static files (collectstatic Django) -------------------------------------
# Cache 30 hari. Aman walau tanpa hash di filename: kalau Anda update CSS/JS
# selama development, browser yang akses harian akan refresh max 30 hari.
# Naikkan ke 1y kalau Anda pakai ManifestStaticFilesStorage / cache busting.
location /static/ {
    alias /home/rizkysatriowibowo91/pkimm-umko/staticfiles/;
    expires 30d;
    add_header Cache-Control "public";
    add_header Vary "Accept-Encoding";
    access_log off;
    log_not_found off;
}

# --- Media files (upload via Django) ----------------------------------------
# Cache 7 hari. Pendek karena admin bisa update foto profil/berita kapan saja.
location /media/ {
    alias /home/rizkysatriowibowo91/pkimm-umko/media/;
    expires 7d;
    add_header Cache-Control "public";
    add_header Vary "Accept-Encoding";
    access_log off;
    log_not_found off;
}
