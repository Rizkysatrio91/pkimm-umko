# =============================================================================
# nginx — whitelist Cloudflare edge + real_ip module
# =============================================================================
# Tujuan:
#   1. (Opsional, defense in depth) Tolak request yang TIDAK datang dari edge CF
#      di level nginx, jadi origin tidak bisa diakses langsung via IP publik.
#   2. Pasangkan dengan logika application core/rate_limiter.py:get_client_ip
#      yang memvalidasi CF-Connecting-IP berdasarkan XFF rightmost.
#
# Cara pakai:
#   1. Simpan sebagai /etc/nginx/conf.d/cloudflare.conf (otomatis di-include
#      oleh nginx via konfigurasi default di Debian/Ubuntu) — ATAU letakkan
#      file di /etc/nginx/snippets/cloudflare.conf dan tambahkan
#      `include snippets/cloudflare.conf;` di server block utama.
#   2. Test config: sudo nginx -t
#   3. Reload: sudo systemctl reload nginx
#
# Update daftar IP saat CF mengumumkan range baru:
#   curl https://www.cloudflare.com/ips-v4 -o /etc/nginx/cloudflare-ips-v4.txt
#   curl https://www.cloudflare.com/ips-v6 -o /etc/nginx/cloudflare-ips-v6.txt
#   (atau ganti daftar di file ini secara manual)
# =============================================================================

# --- 1. real_ip module: rewrite $remote_addr ke IP user asli ----------------
# Hanya berlaku saat TCP peer ada di range CF di bawah. Setelah rewrite:
#   - $remote_addr   = IP user (untuk log + $proxy_add_x_forwarded_for)
#   - $realip_remote_addr = IP edge CF asli (jangan dihapus dari config)

# IPv4 Cloudflare (sumber: https://www.cloudflare.com/ips-v4/)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6 Cloudflare (sumber: https://www.cloudflare.com/ips-v6/)
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Loopback (gunicorn ↔ nginx) — diperlukan agar XFF dari nginx ke gunicorn
# juga dianggap trusted untuk passthrough.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;

# Pakai header CF-Connecting-IP sebagai sumber kebenaran. Cloudflare selalu
# meng-overwrite header ini untuk tiap request (penyerang tidak bisa spoof
# dari sisi luar CF).
real_ip_header CF-Connecting-IP;

# recursive: kalau XFF berisi rantai proxy, mundur sampai ketemu IP yang
# BUKAN di trusted list — itu IP user asli.
real_ip_recursive on;
